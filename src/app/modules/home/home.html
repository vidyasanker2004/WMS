<div class="app-container">
  <h2 class="welcome-header">Warehouse Management System
    <span class="username">{{ username }}</span>
    <button class="logout-btn" (click)="logout()"> 
      <img src="signout.png" width="20" height="20" alt="signout Icon">
    </button>
  </h2>
  
  <nav class="side-nav">
    <div class="nav-content">
      <div class="nav-links">
        <div class="leftIcons" [class.box1]="true" [class.active1]="ishomeExpanded" (click)="togglehome()">
           <img src="home-active.png" width="38" height="38" alt="Masters Icon">
            <div class="sidetooltip" [style.display]="ishomeExpanded ? 'block' : 'none'">
            <div class="submenu-left">
              <ul>
                <li *ngFor="let item of homeLinks">
                  <a [routerLink]="item.path" routerLinkActive="active">
                    {{ item.title }}
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="leftIcons" [class.box2]="true" [class.active2]="isMastersExpanded" (click)="toggleMasters()">
           <img src="Masters.png" width="38" height="38" alt="Masters Icon">
            <div class="sidetooltip" [style.display]="isMastersExpanded ? 'block' : 'none'">
            <div class="submenu-left">
              <ul>
                <li *ngFor="let item of masterLinks">
                  <a [routerLink]="item.path" routerLinkActive="active">
                    {{ item.title }}
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>
  
  <main class="content">
    <!-- Show home content only when showHomeContent is true -->
    <div *ngIf="showHomeContent" class="home-content">
      <!-- Your home page content goes here -->
      <h3>Welcome to Warehouse Management System</h3>
      <p>This is your dashboard. Select an option from the side menu to get started.</p>
    </div>
    
    <!-- Router outlet for other components -->
    <router-outlet></router-outlet>
  </main>
</div>
