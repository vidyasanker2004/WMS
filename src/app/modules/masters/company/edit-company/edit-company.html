<div class="common-form-container">
  <h2 class="form-title">Edit Company</h2>
  
  <form [formGroup]="companyForm" (ngSubmit)="onSubmit()" class="company-form-wrapper">
      
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Loading company data...</p>
      </div>
      
      <div class="form-grid">
        <div class="form-field required-field">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" formControlName="companyName" placeholder="Enter company name">
        </div>

        <div class="form-field required-field">
          <label for="companyCode">Company Code</label>
          <input type="text" id="companyCode" formControlName="companyCode" placeholder="Enter company code">
        </div>

        <div class="form-field checkbox-container">
          <input type="checkbox" id="thirdPartyLogistics" formControlName="thirdPartyLogistics">
          <label for="thirdPartyLogistics">3rd Party Logistics (3PL) Co</label>
        </div>

        <div class="form-field required-field">
          <label for="address">Address</label>
          <input type="text" id="address" formControlName="address" placeholder="Enter address">
        </div>

        <div class="form-field required-field">
          <label for="address1">Address1</label>
          <input type="text" id="address1" formControlName="address1" placeholder="Enter address">
        </div>

        <div class="form-field required-field">
          <label for="city">City</label>
          <input type="text" id="city" formControlName="city" placeholder="Enter city">
        </div>

        <div class="form-field required-field">
          <label for="country">Country</label>
          <select id="country" formControlName="country">
            <option value="">Select</option>
            <option *ngFor="let country of countries" [value]="country" [selected]="country === companyForm.value.country">
              {{country}}
            </option>
          </select>
        </div>

        <div class="form-field required-field">
          <label for="state">State</label>
          <select id="state" formControlName="state">
            <option value="">Select</option>
            <option *ngFor="let state of states" [value]="state" [selected]="state === companyForm.value.state">
              {{state}}
            </option>
          </select>
        </div>

        <div class="form-field required-field">
          <label for="pin">Pin</label>
          <input type="text" id="pin" formControlName="pin" placeholder="Enter pin code">
        </div>

        <div class="form-field required-field">
          <label for="email">Email ID</label>
          <input type="email" id="email" formControlName="email" placeholder="Enter email">
        </div>

        <div class="form-field required-field">
          <label for="phone">Phone</label>
          <div class="phone-input-wrapper">
            <select formControlName="phonePrefix">
              <option value="+91">+91</option>
              <option value="+1">+1</option>
            </select>
            <input type="tel" id="phone" formControlName="phone" placeholder="Enter phone number">
          </div>
        </div>
        
        <div class="form-field required-field">
          <label for="contactPartner">Contact Person</label>
          <input type="text" id="contactPartner" formControlName="contactPartner" placeholder="Enter contact person">
        </div>

        <div class="form-field required-field">
          <label for="contactEmail">CP Email</label>
          <input type="email" id="contactEmail" formControlName="contactEmail" placeholder="Enter contact email">
        </div>

        <div class="form-field required-field">
          <label for="mobileNo">CP Mobile No</label>
          <div class="phone-input-wrapper">
            <select formControlName="mobilePrefix">
              <option value="+91">+91</option>
              <option value="+1">+1</option>
            </select>
            <input type="tel" id="mobileNo" formControlName="mobileNo" placeholder="Enter mobile number">
          </div>
        </div>

        <div class="form-field">
          <label for="website">Website URL</label>
          <input type="url" id="website" formControlName="website" placeholder="Enter website URL">
        </div>
    
        <div class="form-field required-field">
          <label for="baseCurrency">Base Currency</label>
          <select id="baseCurrency" formControlName="baseCurrency">
            <option value="">Select</option>
            <option value="INR">INR</option>
            <option value="USD">USD</option>
          </select>
        </div>

        <div class="form-field">
          <label for="eccNo">ECC No</label>
          <input type="text" id="eccNo" formControlName="eccNo" placeholder="Enter ECC number">
        </div>

        <div class="form-field">
          <label for="vatTinNo">VAT TIN No</label>
          <input type="text" id="vatTinNo" formControlName="vatTinNo" placeholder="Enter VAT TIN number">
        </div>

        <div class="form-field">
          <label for="tinDate">TIN Date</label>
          <input type="date" id="tinDate" formControlName="tinDate" placeholder="dd/MM/yyyy">
        </div>

        <div class="form-field">
          <label for="cstNo">CST No</label>
          <input type="text" id="cstNo" formControlName="cstNo" placeholder="Enter CST number">
        </div>

        <div class="form-field">
          <label for="cstDate">CST Date</label>
          <input type="date" id="cstDate" formControlName="cstDate" placeholder="dd/MM/yyyy">
        </div>

        <div class="form-field full-width-field">
          <label for="companyLogo">Company Logo</label>
          <input type="file" id="companyLogo" (change)="onFileChange($event)" accept="image/*">
          <span class="file-hint-text">Image size ≤ 1MB, 600x600 pixels</span>
        </div>
      </div>    

    <div class="form-actions">
      <button type="submit" class="btn primary-btn" [disabled]="(!companyForm.valid) || isUpdating">
        <span *ngIf="!isUpdating">Update</span>
        <span *ngIf="isUpdating">Updating...</span>
      </button>
      <button type="button" class="btn secondary-btn"routerLink="/home/company">Exit</button>
    </div>
  </form>
</div>
