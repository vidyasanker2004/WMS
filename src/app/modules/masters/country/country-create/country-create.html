<div class="common-form-container">
  <h2 class="form-title">Create New Country</h2>
  <form [formGroup]="countryForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
    <div class="form-field">
      <label for="name">Country Name</label>
      <input type="text" id="name" formControlName="countryName">
      <div *ngIf="countryForm.get('countryName')?.invalid && countryForm.get('countryName')?.touched" 
           class="error-message">
        Name is required and must be at least 3 characters
      </div>
    </div>

    <div class="form-field">
      <label for="code">Country Code</label>
      <input type="text" id="code" formControlName="countryCode" maxlength="3">
      <div *ngIf="countryForm.get('countryCode')?.invalid && countryForm.get('countryCode')?.touched" 
           class="error-message">
        Code is required (max 3 characters)
      </div>
    </div>
    </div>

    <div class="form-actions">
      <button type="button" routerLink="/home/countries" class="btn btn-secondary">Cancel</button>
      <button type="submit" [disabled]="countryForm.invalid" class="btn btn-primary">Create</button>
    </div>
  </form>
</div>
