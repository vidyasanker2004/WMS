<div class="common-form-container">
  <h2 class="form-title">Create New State</h2>

  <form [formGroup]="stateForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-field">
        <label for="countryName">Country Name</label>
        <input type="text" id="countryName" formControlName="countryName">
        <div *ngIf="stateForm.get('countryName')?.invalid && stateForm.get('countryName')?.touched" 
             class="error-message">
          Country name is required and must be at least 3 characters
        </div>
      </div>
      <div class="form-field">
        <label for="stateName">State Name</label>
        <input type="text" id="stateName" formControlName="stateName">
        <div *ngIf="stateForm.get('stateName')?.invalid && stateForm.get('stateName')?.touched" 
             class="error-message">
          State name is required and must be at least 3 characters
        </div>
      </div>
      <div class="form-field">
        <label for="stateCode">State Code</label>
        <input type="text" id="stateCode" formControlName="stateCode" maxlength="3">
        <div *ngIf="stateForm.get('stateCode')?.invalid && stateForm.get('stateCode')?.touched" 
             class="error-message">
          State code is required (max 3 characters)
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" routerLink="/home/states" class="btn btn-secondary">Cancel</button>
      <button type="submit" [disabled]="stateForm.invalid" class="btn btn-primary">Create</button>
    </div>
  </form>
</div>
