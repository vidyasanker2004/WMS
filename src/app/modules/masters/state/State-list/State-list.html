<div class="common-list">
  <h2>States</h2>
  <div class="actions">
    <a routerLink="/home/states/create" class="btn btn-primary">
       New 
    </a>
  </div>

  <div *ngIf="isLoading" class="loading-indicator">
    Loading states...
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage" class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>Actions</th>
          <th>Name</th>
          <th>Code</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let state of states">
          <td class="actions">
            <a (click)="editState(state.id)" class="btn btn-sm btn-edit">
              Edit
            </a>
            <button (click)="deleteState(state.id)" class="btn btn-sm btn-delete">
              Delete
            </button>
          </td>
          <td>{{ state.name }}</td>
          <td>{{ state.code }}</td>
        </tr>
        <tr *ngIf="states.length === 0 && !isLoading && !errorMessage">
          <td colspan="4" class="text-center">No states found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
